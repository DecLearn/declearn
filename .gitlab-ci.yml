### Overall configuration

# Define conditions under which pipelines may be run,
# and create custom variables for jobs to re-use.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        IS_MERGE_REQ: "true"
        BRANCH_NAME: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    - if: ($CI_PIPELINE_SOURCE == "push") &&
          (($CI_COMMIT_BRANCH == "develop") ||
          ($CI_COMMIT_BRANCH =~ "/^r\d\.\d+/")) # matches release branches (e.g. r1.0)
      variables:
        IS_CORE_PUSH: "true"
        BRANCH_NAME: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/  # release tag (vMAJOR.MINOR.PATCH) push -> bench regression check
      variables:
        IS_RELEASE_TAG: "true"
        BRANCH_NAME: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web" && $BENCH_BOOTSTRAP == "true"  # manual UI trigger w/ BENCH_BOOTSTRAP=true -> bench-bootstrap
      variables:
        IS_BOOTSTRAP: "true"
        BRANCH_NAME: $CI_COMMIT_BRANCH

# Pipeline stages: clean-up cached files, then run tests, then bench.
stages:
  - clean
  - test
  - bench

# Use environment variables to;
# - keep pip cache files between runs (on the Docker executor)
# - keep tox cache files, but make them branch-specific
# - keep the small venv where pip and tox are installed
variables:
  TOX_CACHE_DIR: "$CI_PROJECT_DIR/.tox"
  # Preserve pip / tox / venv across jobs (existing); add the bench
  # MNIST splits and ASV's per-commit virtualenv dir so the bench
  # job doesn't re-download data or re-install torch+tf each pipeline.
  GIT_CLEAN_FLAGS: -ffdx -e .pip -e .tox -e /venv -e benchmarks/data -e benchmarks/.asv/env

# Shared configuration elements between all jobs.
default:
  image: "registry.gitlab.inria.fr/magnet/declearn/declearn/ci-python311:latest"
  tags:
    - magnet
    - gpu


### Clean stage

# Automatic job to remove the tox cache for a merged branch.
clean-tox-cache-merged-branch:
  stage: clean
  script:
    - MERGED_BRANCH=$(echo $CI_COMMIT_TITLE | grep -P "'.*?'(?= into)" -o)
    - echo "Removing tox venv for merged branch $MERGED_BRANCH"
    - rm -rf $TOX_CACHE_DIR/${MERGED_BRANCH:1:-1}
  rules:
    - if: $IS_CORE_PUSH && ($CI_COMMIT_TITLE =~ /Merge branch '.*?' into '.*?'/)

# Manual job to remove the tox cache for the current branch.
# Also called when a merge commit is detected on a main branch.
clean-tox-cache-current-branch:
  stage: clean
  variables:
    TOX_WORKDIR: $TOX_CACHE_DIR/$BRANCH_NAME
  script:
    - echo "Removing tox venv for current branch at $TOX_WORKDIR"
    - rm -rf $TOX_WORKDIR
  rules:
    - if: $IS_CORE_PUSH && ($CI_COMMIT_TITLE =~ /Merge branch '.*?' into '.*?'/)
      when: always
    - when: manual
      allow_failure: true

# Manual job to remove the tox cache for the all branches.
clean-tox-cache-full:
  stage: clean
  script:
    - echo "Removing the entire tox cache at $TOX_CACHE_DIR"
    - rm -rf $TOX_CACHE_DIR
  when: manual
  allow_failure: true


### Test stage

# Shared configuration elements between test jobs.
.test_cfg:
  stage: test
  # Activate venv with pip and tox installed.
  before_script:
    - source /venv/bin/activate # /venv creation is defined in ci/Dockerfile
  # Configure coverage export and collection.
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  coverage: /(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/
  # Define the preserved-across-jobs, branch-dependent tox workdir.
  variables:
    TOX_WORKDIR: $TOX_CACHE_DIR/$BRANCH_NAME

# Basic test suite: skip GPU use and a few extra integration tests scenarios.
# This job is called when commits are pushed to a non-draft MR branch.
# It may also be called manually on commits to draft MR branches.
test-minimal:
  extends:
    .test_cfg
  script:
    - tox -e py311-ci --workdir=$TOX_WORKDIR -- --cpu-only
  rules:
    - if: $IS_MERGE_REQ && ($CI_MERGE_REQUEST_TITLE !~ /^Draft:.*/)
    - if: $IS_MERGE_REQ && ($CI_MERGE_REQUEST_TITLE =~ /^Draft:.*/)
      when: manual
      allow_failure: true

# Exhaustive test suite: lint the code, run all tests, use GPU when available.
# This job is called when commits are pushed to a main branch.
# It may also be called manually on commits to MR branches.
test-maximal:
  extends:
    .test_cfg
  script:
    - tox -e py311-ci --workdir=$TOX_WORKDIR -- --fulltest
  rules:
    - if: $IS_CORE_PUSH
    - if: $IS_MERGE_REQ
      when: manual
      allow_failure: true  # do not block the base "test" pipeline
  tags:
    - gpu
    - magnet


### Bench stage

# Shared configuration for benchmark jobs. The host venv (/venv) already
# has pip + tox; ASV and pyyaml are the only deltas this layer pulls
# in (~30s, cached via $CI_PROJECT_DIR/.pip across pipelines).
# declearn + torch/tf get installed by ASV into its per-commit virtualenv
# at .asv/env/, which is preserved across pipelines via GIT_CLEAN_FLAGS.
.bench_cfg:
  stage: bench
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl unzip
    - source /venv/bin/activate
    - pip install --quiet asv pyyaml
    - git fetch --quiet origin '+refs/heads/develop:refs/heads/develop' || true # non-fatal: only feeds asv publish's HTML timeline; the regression check works without it
  variables:
    # Full clone so `git describe` can find the previous release tag.
    GIT_DEPTH: "0"
  artifacts:
    when: always      # keep results + html even when regression is detected
    expire_in: never  # cumulative history; small JSONs grow monotonically
    paths:
      - benchmarks/.asv/results/
      - benchmarks/.asv/html/
      - benchmarks/asv.conf.json

# Bench regression check on each release tag push; same job runs in
# bootstrap mode when a pipeline is started from the GitLab UI with the
# BENCH_BOOTSTRAP=true variable set. See the Benchmarking page in the
# developer guide (docs/devs-guide/benchmarks.md).
benchmarks:
  extends:
    .bench_cfg
  allow_failure: true  # regression -> non-blocking warning, does not fail the release pipeline
  rules:
    - if: $IS_RELEASE_TAG  # release tag push: regression-check mode (warns on regression)
    - if: $IS_BOOTSTRAP    # manual UI trigger w/ BENCH_BOOTSTRAP=true: bootstrap mode
  variables:
    BOOTSTRAP_TAGS: "v2.7.0 v2.8.0"
  script:
    - cd "$CI_PROJECT_DIR/benchmarks"
    - mkdir -p .asv/results
    - |
      # set -e is intentionally off: a regression makes `asv continuous` exit
      # non-zero; we capture that code but still run `asv publish` first.
      set -o pipefail
      REGRESSION_EXIT=0
      if [ "$IS_BOOTSTRAP" = "true" ]; then
        echo "bootstrap: seeding [$BOOTSTRAP_TAGS]"
        for TAG in $BOOTSTRAP_TAGS; do PRESET=ci ./run_benchmarks.sh run "${TAG}^!"; done
      else
        PREV_TAG=$(git describe --tags --abbrev=0 "${CI_COMMIT_TAG}^" 2>/dev/null || true)
        HAVE_PRIOR=false
        # Try the previous tag's artifact, then develop's bootstrap; curl/unzip
        # failures fall through to soft-seed rather than aborting the job.
        for REF_TRY in "$PREV_TAG" "develop"; do
          [ -z "$REF_TRY" ] && continue
          echo "fetching baseline artifact (ref=$REF_TRY)"
          # Pull the artifact archive of the last successful `benchmarks` job on
          # $REF_TRY via the GitLab jobs-artifacts API (JOB-TOKEN authenticates
          # the request; --fail turns a missing artifact / HTTP error into a
          # non-zero exit; --location follows redirects to the storage backend).
          # Only if the download succeeds do we unzip it (-o overwrite, -q quiet)
          # into the project dir, restoring the prior .asv/results as the
          # comparison baseline. Either step failing -> try the next ref.
          if curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --location --silent --fail \
               --output /tmp/prev.zip \
               "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/artifacts/$REF_TRY/download?job=benchmarks" \
             && unzip -o -q /tmp/prev.zip -d "$CI_PROJECT_DIR"
          then
            HAVE_PRIOR=true; break; 
          fi
        done
        if [ "$HAVE_PRIOR" = "true" ]; then
          echo "regression check: $PREV_TAG vs $CI_COMMIT_TAG (factor 1.5, non-blocking)"
          PRESET=ci ./run_benchmarks.sh continuous "$PREV_TAG" "$CI_COMMIT_TAG" --factor 1.5 || REGRESSION_EXIT=$?
        else
          echo "no prior baseline; soft-seeding $CI_COMMIT_TAG"
          PRESET=ci ./run_benchmarks.sh run "${CI_COMMIT_TAG}^!"
        fi
      fi
      asv publish
      exit $REGRESSION_EXIT
